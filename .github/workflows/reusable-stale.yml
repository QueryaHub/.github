name: Stale (reusable)

# Gentle policy: only items that are waiting on the reporter are closed.
# Roadmap issues, milestones and anything without `needs-info` are never touched.
on:
  workflow_call:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          only-issue-labels: needs-info
          days-before-issue-stale: 14
          days-before-issue-close: 7
          stale-issue-label: stale
          stale-issue-message: >
            This issue is waiting for more information and has had no activity for 14 days.
            It will be closed in 7 days unless there is an update.
          close-issue-message: >
            Closing due to inactivity. Feel free to reopen with the requested details.
          days-before-pr-stale: 30
          days-before-pr-close: 14
          stale-pr-label: stale
          stale-pr-message: >
            This pull request has had no activity for 30 days. It will be closed in 14 days
            unless there is an update.
          close-pr-message: >
            Closing due to inactivity. Feel free to reopen when you are ready to continue.
          exempt-issue-labels: security,blocked,good first issue,help wanted
          exempt-pr-labels: security,blocked
          exempt-all-milestones: true
          exempt-draft-pr: true
